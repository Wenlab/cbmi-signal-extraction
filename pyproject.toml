[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbmi-signal-extraction"
version = "0.1.0"
description = "CPU/GPU signal extraction from CBMI neuron bounding boxes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
signal-extraction = "signal_extraction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
