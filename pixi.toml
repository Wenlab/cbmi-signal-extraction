[workspace]
authors = ["JH Wang <1125623896@qq.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
channel-priority = "disabled"
name = "signal_extraction"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
signal-extraction = "python -m signal_extraction"
test = "python -m unittest discover -s tests -v"
check-cuda = "python -c \"import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))\""

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<3"
h5py = ">=3.10,<4"
tqdm = ">=4.66,<5"

[target.linux-64.dependencies]
pytorch = { version = "==2.5.1", build = "py3.11_cuda11.8_cudnn9.1.0_0", channel = "pytorch" }
pytorch-cuda = { version = "11.8.*", channel = "pytorch" }

[target.win-64.pypi-dependencies]
torch = { version = "==2.6.*", index = "https://download.pytorch.org/whl/cpu" }

[pypi-dependencies]
cbmi-signal-extraction = { path = ".", editable = true }
tifffile = ">=2024.8,<2027"
opencv-python-headless = ">=4.10,<5"
